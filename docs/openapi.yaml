openapi: 3.0.3
info:
  title: CyberGuard AI backend API
  version: 0.1.0
  description: Local development backend. Exact-origin credentialed CORS is supported; a same-origin frontend proxy is recommended. PostgreSQL integration validation requires local credentials.
servers:
  - url: /api/v1
security:
  - session: []
paths:
  /settings/virustotal:
    get:
      description: Current user's VirusTotal metadata only. Credentials are never returned.
      responses:
        '200':
          description: Provider metadata
          content:
            application/json:
              schema:
                type: object
                properties:
                  provider: {type: string, enum: [virustotal]}
                  model: {type: string}
                  enabled: {type: boolean}
                  has_credential: {type: boolean}
                  connection_status: {type: string}
                  last_success_at: {type: string, format: date-time, nullable: true}
                  source: {type: string}
    post:
      description: Save encrypted VirusTotal key. Empty key preserves saved credentials. Enablement does not replace per-analysis hash sharing consent.
      parameters:
        - {$ref: '#/components/parameters/CSRF'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [provider, enabled]
              properties:
                provider: {type: string, enum: [virustotal]}
                model: {type: string}
                enabled: {type: boolean}
                api_key: {type: string, format: password, writeOnly: true, maxLength: 4096}
      responses:
        '200': {description: 'Saved provider metadata, without credential'}
        '400': {$ref: '#/components/responses/Error'}
    delete:
      parameters:
        - {$ref: '#/components/parameters/CSRF'}
      responses:
        '204': {description: Credential removed and lookups disabled}
  /settings/virustotal/test:
    post:
      description: Explicit lookup of the public empty-file SHA-256. Consumes one quota unit. Sends no email data. Does not upload anything. Success means lookup access (200 or 404), not file safety.
      parameters:
        - {$ref: '#/components/parameters/CSRF'}
      responses:
        '200':
          description: Test outcome
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: {type: boolean}
                  failure_code: {type: string}
                  test_type: {type: string, enum: [public_hash_lookup]}
                  inference_performed: {type: boolean, enum: [false]}
        '400': {$ref: '#/components/responses/Error'}
  /settings/ai-provider:
    get:
      description: Current user's provider metadata only; API keys are never returned
      responses:
        '200': {$ref: '#/components/responses/ProviderConfig'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
    post:
      description: Save OpenAI settings. Empty or omitted api_key preserves the existing key. Updates reset connection status to untested.
      parameters:
        - {$ref: '#/components/parameters/CSRF'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [provider, model, enabled]
              properties:
                provider: {type: string, enum: [openai]}
                model: {type: string, maxLength: 128}
                enabled: {type: boolean}
                api_key: {type: string, format: password, writeOnly: true, maxLength: 4096}
      responses:
        '200': {$ref: '#/components/responses/ProviderConfig'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
    delete:
      description: Erases encrypted credentials and disables AI; preserves a disabled settings record so operator fallback does not reactivate AI
      parameters:
        - {$ref: '#/components/parameters/CSRF'}
      responses:
        '204': {description: Credentials removed}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
  /settings/ai-provider/test:
    post:
      description: Explicit model metadata request to OpenAI. Validates credentials/model access without inference or email content. Does not prove Responses compatibility or inference quota. No inference tokens are requested.
      parameters:
        - {$ref: '#/components/parameters/CSRF'}
      responses:
        '200':
          description: Test outcome; success may be false
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: {type: boolean}
                  failure_code: {type: string}
                  test_type: {type: string, enum: [model_metadata]}
                  inference_performed: {type: boolean, enum: [false]}
                  inference_tokens: {type: integer, enum: [0]}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
  /auth/register:
    post:
      operationId: register
      security: []
      description: Requires PUBLIC_REGISTRATION_ENABLED=true, the allowed Origin, and application/json. New and duplicate emails receive identical 202 responses. Creates active accounts without sessions; never changes existing accounts. Shares the login IP rate limit.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, display_name, password, confirm_password]
              properties:
                email: {type: string, format: email, description: Trimmed and lowercased; normalized maximum 254 bytes}
                display_name: {type: string, description: Trimmed nonempty UTF-8; maximum 200 bytes; no control characters}
                password: {type: string, format: password, minLength: 12, description: Maximum 1024 UTF-8 bytes; weak passwords rejected}
                confirm_password: {type: string, format: password, description: Must exactly match password}
      responses:
        '202':
          description: Identical acknowledgment for new and existing accounts; proceed to login
          content:
            application/json:
              schema:
                type: object
                required: [code, message]
                properties:
                  code: {type: string, enum: [REGISTRATION_ACCEPTED]}
                  message: {type: string}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '415': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /health:
    get:
      security: []
      responses:
        '200': {description: PostgreSQL reachable}
        '503': {$ref: '#/components/responses/Error'}
  /config/public:
    get:
      security: []
      responses:
        '200':
          description: Public capabilities, no secrets
          content:
            application/json:
              schema:
                type: object
                properties:
                  languages: {type: array, items: {type: string}}
                  max_email_size: {type: integer}
                  public_signup: {type: boolean, description: Whether public registration is enabled; false by default}
  /analyses:
    post:
      operationId: createAnalysis
      parameters:
        - {$ref: '#/components/parameters/CSRF'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [source_type]
              properties:
                source_type: {type: string, enum: [paste]}
                text: {type: string}
                sender: {type: string}
                subject: {type: string}
                external_processing_consent: {type: boolean, default: false}
                virustotal_consent: {type: boolean, default: false, description: Separate consent to transmit attachment SHA-256 hashes}
                ai_requested: {type: boolean, description: Defaults to consent for backward compatibility; true requires explicit consent before external processing}
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: {type: string, format: binary, description: EML or MSG up to 10 MiB}
                external_processing_consent: {type: boolean, default: false}
                virustotal_consent: {type: boolean, default: false, description: Separate consent to transmit attachment SHA-256 hashes}
                ai_requested: {type: boolean, description: Literal true requests AI; consent also requests AI for existing clients}
      responses:
        '201': {$ref: '#/components/responses/Analysis'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
    get:
      operationId: listAnalyses
      parameters:
        - {name: page, in: query, schema: {type: integer, minimum: 1, maximum: 100000, default: 1}}
        - {name: page_size, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
        - {name: search, in: query, schema: {type: string}}
        - {name: verdict, in: query, schema: {type: string, enum: [legitimate, suspicious, phishing, inconclusive]}}
        - {name: mode, in: query, schema: {type: string, enum: [live], default: live}}
        - {name: sort, in: query, schema: {type: string, enum: [newest, oldest, risk_desc, risk_asc], default: newest}}
        - {name: date_from, in: query, schema: {type: string}, description: Inclusive RFC3339 instant or UTC date}
        - {name: date_to, in: query, schema: {type: string}, description: Exclusive RFC3339 instant; a date includes the entire UTC day}
      responses:
        '200':
          description: Owner-scoped history, newest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  page: {type: integer}
                  page_size: {type: integer}
                  total: {type: integer}
                  items: {type: array, items: {$ref: '#/components/schemas/Analysis'}}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
  /analyses/{id}:
    parameters:
      - {$ref: '#/components/parameters/AnalysisID'}
    get:
      responses:
        '200': {$ref: '#/components/responses/Analysis'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
    delete:
      parameters:
        - {$ref: '#/components/parameters/CSRF'}
      responses:
        '204': {description: Owner-scoped report deleted}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /analyses/{id}/export:
    get:
      parameters:
        - {$ref: '#/components/parameters/AnalysisID'}
        - {name: format, in: query, required: true, schema: {type: string, enum: [pdf, json]}}
        - {name: lang, in: query, schema: {type: string, enum: [en, ru, kk], default: en}}
      responses:
        '200':
          description: Owner-scoped downloadable report
          content:
            application/pdf:
              schema: {type: string, format: binary}
            application/json:
              schema: {$ref: '#/components/schemas/Analysis'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /dashboard/stats:
    get:
      parameters:
        - {name: period, in: query, schema: {type: string, enum: ['7', '30', '90', all], default: '30'}}
        - {name: mode, in: query, schema: {type: string, enum: [live], default: live}}
      responses:
        '200':
          description: Owner-scoped PostgreSQL aggregates
          content:
            application/json:
              schema:
                type: object
                properties:
                  total_analyses: {type: integer}
                  mode: {type: string}
                  verdict_distribution: {type: object, additionalProperties: {type: integer}}
                  risk_distribution: {type: object, additionalProperties: {type: integer}}
                  activity: {type: object, additionalProperties: {type: integer}, description: UTC date to count mapping}
                  activity_series: {type: array, items: {type: object, properties: {date: {type: string}, count: {type: integer}}}}
                  common_indicators: {type: array, items: {$ref: '#/components/schemas/Frequency'}}
                  common_attack_types: {type: array, items: {$ref: '#/components/schemas/Frequency'}}
                  recent_analyses: {type: array, items: {$ref: '#/components/schemas/Analysis'}}
                  legitimate_count: {type: integer}
                  suspicious_count: {type: integer}
                  phishing_count: {type: integer}
                  inconclusive_count: {type: integer}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
  /auth/login:
    post:
      operationId: login
      security: []
      description: Consumes temporary credentials atomically or authenticates a permanent password. Requires an allowed Origin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, password]
              properties:
                email: {type: string, format: email}
                password: {type: string, format: password, maxLength: 1024}
      responses:
        '200': {$ref: '#/components/responses/Auth'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
  /auth/activate-account:
    post:
      operationId: activateAccount
      description: Requires an unexpired setup session. Consumes it and issues a fresh regular session.
      parameters:
        - {$ref: '#/components/parameters/CSRF'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/NewPassword'}
      responses:
        '200': {$ref: '#/components/responses/Auth'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
  /auth/logout:
    post:
      operationId: logout
      description: Revokes either a setup or regular session and expires the cookie.
      parameters:
        - {$ref: '#/components/parameters/CSRF'}
      responses:
        '204': {description: Session revoked}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
  /auth/change-password:
    post:
      operationId: changePassword
      description: Requires a regular session; revokes all sessions on success. Log in again.
      parameters:
        - {$ref: '#/components/parameters/CSRF'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - {$ref: '#/components/schemas/NewPassword'}
                - type: object
                  required: [current_password]
                  properties:
                    current_password: {type: string, format: password, maxLength: 1024}
      responses:
        '204': {description: Password changed; login required}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
  /auth/me:
    get:
      operationId: currentUser
      description: Requires a regular session. Setup sessions receive PASSWORD_CHANGE_REQUIRED.
      responses:
        '200': {$ref: '#/components/responses/Auth'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: cyberguard_session
  parameters:
    AnalysisID:
      name: id
      in: path
      required: true
      schema: {type: string, format: uuid}
    CSRF:
      name: X-CSRF-Token
      in: header
      required: true
      schema: {type: string}
  schemas:
    ProviderConfig:
      type: object
      properties:
        provider: {type: string, enum: [openai]}
        model: {type: string}
        enabled: {type: boolean}
        has_credential: {type: boolean}
        connection_status: {type: string, description: 'not_configured, untested, credential_validated, or stable provider failure code'}
        last_success_at: {type: string, format: date-time, nullable: true}
        source: {type: string, enum: [user, operator]}
    AIExecution:
      type: object
      properties:
        requested: {type: boolean}
        consent: {type: boolean}
        configured: {type: boolean}
        provider: {type: string}
        model: {type: string}
        configuration_source: {type: string}
        status: {type: string, enum: [not_requested, not_configured, running, completed, failed, authentication_failed, quota_exceeded, rate_limited, unsupported_model, invalid_response, timeout, network_error, provider_error]}
        failure_code: {type: string}
        static_verdict: {type: string}
        deterministic_risk_score: {type: integer}
        ai_proposed_verdict: {type: string}
        final_verdict: {type: string}
        influence_code: {type: string}
    ContextualFinding:
      type: object
      properties:
        type: {type: string}
        quote: {type: string}
        source: {type: string, enum: [subject, text_body, html_body]}
        reason: {type: string}
        confidence: {type: string, enum: [low, medium, high]}
        verification_status: {type: string}
    Finding:
      type: object
      required: [id, rule_id, type, severity, evidence, evidence_source, description_code, analysis_method, status]
      properties:
        id: {type: string}
        rule_id: {type: string}
        type: {type: string}
        severity: {type: string}
        evidence: {type: string}
        evidence_source: {type: string}
        description_code: {type: string}
        analysis_method: {type: string}
        status: {type: string}
    IOC:
      type: object
      required: [type, value, normalized_value, defanged_value, source]
      properties:
        resource_category: {type: string}
        original_value: {type: string}
        finding_ids: {type: array, items: {type: string}}
        suspicion_status: {type: string}
        type: {type: string, enum: [url, domain, ip, email, hash, sha256]}
        value: {type: string}
        normalized_value: {type: string}
        defanged_value: {type: string}
        source: {type: string}
    Attachment:
      type: object
      required: [filename, declared_mime, detected_mime, size, sha256]
      properties:
        filename: {type: string}
        declared_mime: {type: string}
        detected_mime: {type: string}
        size: {type: integer, minimum: 0}
        sha256: {type: string}
    LocalizedText:
      type: object
      required: [en, ru, kk]
      additionalProperties: false
      properties:
        en: {type: string}
        ru: {type: string}
        kk: {type: string}
    AIAssessment:
      type: object
      properties:
        severity: {type: string, enum: [none, low, medium, high, critical]}
        confidence: {type: string, enum: [low, medium, high], description: 'Qualitative model confidence, not a calibrated probability'}
        contextual_findings: {type: array, items: {$ref: '#/components/schemas/ContextualFinding'}}
        proposed_verdict: {type: string, enum: [legitimate, suspicious, phishing, inconclusive]}
        suspected_attack_types: {type: array, items: {type: string}}
        social_engineering_patterns: {type: array, items: {type: string}}
        supporting_evidence_ids: {type: array, items: {type: string}}
        contradictory_evidence_ids: {type: array, items: {type: string}}
        uncertainty_notes: {type: array, items: {type: string}}
        explanations: {$ref: '#/components/schemas/LocalizedText'}
        recommendations: {$ref: '#/components/schemas/LocalizedText'}
        usage:
          type: object
          properties:
            input_tokens: {type: integer}
            output_tokens: {type: integer}
            total_tokens: {type: integer}
    EmailMetadata:
      type: object
      properties:
        source_type: {type: string}
        filename: {type: string}
        file_sha256: {type: string}
        message_id: {type: string}
        subject: {type: string}
        sender: {type: string}
        reply_to: {type: string}
        recipients: {type: array, nullable: true, items: {type: string}}
        timestamp: {type: string, format: date-time}
        headers: {type: object, nullable: true, additionalProperties: {type: array, items: {type: string}}}
        text_body: {type: string, description: Empty in stored reports}
        html_body: {type: string, description: Empty in stored reports}
        attachments: {type: array, nullable: true, items: {$ref: '#/components/schemas/Attachment'}}
        parser_warnings: {type: array, nullable: true, items: {type: string}}
        authentication_results: {type: array, nullable: true, items: {type: string}}
        available_evidence: {type: array, nullable: true, items: {type: string}}
    Frequency:
      type: object
      required: [name, count]
      properties:
        name: {type: string}
        count: {type: integer}
    Analysis:
      type: object
      required: [id, mode, created_at, report, status, explanations, recommendations]
      properties:
        ai_execution: {$ref: '#/components/schemas/AIExecution'}
        top_findings: {type: array, maxItems: 5, items: {$ref: '#/components/schemas/Finding'}}
        id: {type: string, format: uuid}
        mode: {type: string, enum: [live]}
        created_at: {type: string, format: date-time}
        status: {type: string, enum: [complete, partial]}
        explanations: {$ref: '#/components/schemas/LocalizedText'}
        recommendations: {$ref: '#/components/schemas/LocalizedText'}
        ai_assessment: {$ref: '#/components/schemas/AIAssessment'}
        report:
          type: object
          properties:
            evidence:
              type: array
              items:
                type: object
                properties:
                  id: {type: string}
                  source: {type: string}
                  value: {type: string}
                  trust_status: {type: string}
            authentication:
              type: array
              items:
                type: object
                properties:
                  evidence_id: {type: string}
                  mechanism: {type: string, enum: [spf, dkim, dmarc]}
                  reported_result: {type: string}
                  reporting_server: {type: string}
                  evidence_source: {type: string}
                  trust_status: {type: string}
                  verification_status: {type: string}
                  alignment_information: {type: string}
                  limitations: {type: array, items: {type: string}}
            virustotal_status: {type: string}
            attachment_reputation:
              type: array
              items:
                type: object
                properties:
                  sha256: {type: string}
                  status: {type: string, enum: [not_requested, not_configured, skipped_no_attachments, checking, completed, not_found, authentication_failed, access_forbidden, rate_limited, timeout, network_error, provider_error]}
                  source: {type: string}
                  statistics: {type: object, additionalProperties: {type: integer}}
                  last_analysis_at: {type: string, format: date-time}
                  checked_at: {type: string, format: date-time}
                  engines:
                    type: array
                    items:
                      type: object
                      properties:
                        name: {type: string}
                        category: {type: string}
                        result: {type: string}
            verdict: {type: string, enum: [legitimate, suspicious, phishing, inconclusive]}
            risk_score: {type: integer, minimum: 0, maximum: 100}
            risk_level: {type: string, enum: [low, medium, high, critical]}
            scoring_version: {type: string}
            attack_types: {type: array, items: {type: string}}
            indicators: {type: array, items: {$ref: '#/components/schemas/Finding'}}
            iocs: {type: array, items: {$ref: '#/components/schemas/IOC'}}
            limitations: {type: array, items: {type: string}}
            manual_review_required: {type: boolean}
            email: {$ref: '#/components/schemas/EmailMetadata'}
            ai_status: {type: string, enum: [not_requested, not_configured, completed, failed, rate_limited, authentication_failed, quota_exceeded, unsupported_model, invalid_response, timeout, network_error, provider_error, unavailable]}
    NewPassword:
      type: object
      required: [new_password, confirm_password]
      properties:
        new_password: {type: string, format: password, minLength: 12, maxLength: 1024}
        confirm_password: {type: string, format: password, minLength: 12, maxLength: 1024}
    Auth:
      type: object
      required: [user, password_change_required, csrf_token]
      properties:
        password_change_required: {type: boolean}
        csrf_token: {type: string}
        user:
          type: object
          required: [id, email, display_name]
          properties:
            id: {type: string, format: uuid}
            email: {type: string, format: email}
            display_name: {type: string}
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id]
          properties:
            code:
              type: string
              description: Stable machine-readable code. Includes INVALID_CREDENTIALS, UNAUTHENTICATED, PASSWORD_CHANGE_REQUIRED, CSRF_INVALID, ORIGIN_INVALID, PASSWORD_CHANGE_FAILED, PASSWORD_MISMATCH, RATE_LIMITED, NOT_FOUND, INVALID_UPLOAD, INVALID_REQUEST, INTERNAL_ERROR and parser limit codes.
            message: {type: string}
            request_id: {type: string}
  responses:
    ProviderConfig:
      description: Non-secret provider configuration
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ProviderConfig'}
    Analysis:
      description: Saved analysis owned by the current authenticated user
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Analysis'}
    Auth:
      description: Authentication state; cookie is HttpOnly, SameSite=Strict, Path=/, and Secure under HTTPS.
      headers:
        Set-Cookie:
